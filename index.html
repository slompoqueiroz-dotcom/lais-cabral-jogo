<body>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,TAU=Math.PI*2;
const BX=340,BY=335,BREGMA_Y=BY-60,PX_MM=40;
const TOTAL=6;
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

// ---------- estado ----------
let state='intro',level=0,results=[],score=0,t=0;
let mouse={x:W/2,y:H/2},keys={},buttons=[];
let hand={x:W/2,y:H/2},lagK=7,driftAmp=8,driftPh=[0,0,0,0],touchMode=false;
let target=null,aimT=0,timeLimit=12,tremorAmp=5,fade=false,breath=1,holding=false,timedOut=false;
let injPoint=null,injT=0,res=null,rt=0,particles=[],ratNames=[],solution='';
const REGIONS=[
 {n:'Córtex pré-frontal',x:38,y:-132},{n:'Núcleo accumbens',x:42,y:-100},
 {n:'Estriado dorsal',x:80,y:-68},{n:'Córtex motor',x:96,y:-118},
 {n:'Tálamo',x:30,y:10},{n:'Amígdala',x:118,y:8},
 {n:'Hipocampo',x:84,y:48},{n:'Área tegmental ventral',x:24,y:84}];
const SOLUTIONS=['Muscimol 0,5 µg/µL','Vírus AAV-GFP','Dopamina 1 mM','Bicuculina 10 ng','Agonista CNO','Corante Fast Green'];
const NAMES=['Pipoca','Paçoca','Biscoito','Fubá','Tapioca','Brigadeiro','Cocada','Quindim','Pamonha','Jujuba'];

// ---------- áudio ----------
let AC=null;
function snd(f,d=.12,type='sine',vol=.12,slide=0,delay=0){
 if(!AC)return;const s=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,s);if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),s+d);
 g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.02);
}

// ---------- utilidades ----------
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>1-Math.pow(1-clamp(k),3);
function rnd(a,b){return a+Math.random()*(b-a)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU)}
function ell(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,TAU)}
function txt(s,x,y,size=16,color='#fff',align='left',weight='normal'){
 ctx.font=`${weight} ${size}px ${FONT}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y)}
function wrap(s,x,y,maxW,lh,size,color='#fff',align='left',weight='normal'){
 ctx.font=`${weight} ${size}px ${FONT}`;const words=s.split(' ');let line='';
 for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){txt(line,x,y,size,color,align,weight);y+=lh;line=w}else line=test}
 if(line){txt(line,x,y,size,color,align,weight);y+=lh}return y}
function hit(b,p){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h}
function button(label,x,y,w,h,fn,color='#2fb37a'){
 const b={x,y,w,h,fn};buttons.push(b);const hov=hit(b,mouse);
 ctx.save();ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;
 rr(x,y-(hov?2:0),w,h,h/2);ctx.fillStyle=hov?'#45d394':color;ctx.fill();ctx.restore();
 txt(label,x+w/2,y+h/2+7-(hov?2:0),20,'#fff','center','bold')}
function heart(x,y,s,color){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=color;ctx.beginPath();
 ctx.moveTo(0,4);ctx.bezierCurveTo(-10,-4,-6,-12,0,-7);ctx.bezierCurveTo(6,-12,10,-4,0,4);ctx.fill();ctx.restore()}
function fmt(n){return n.toFixed(1).replace('.',',')}
function sgn(n){return(n>=0?'+':'−')+fmt(Math.abs(n))}

// ---------- Seattle (janela) ----------
const SKY=[...Array(14)].map((_,i)=>({w:18+((i*37)%22),h:40+((i*53)%90)}));
function drawSeattle(x,y,w,h){
 ctx.save();rr(x,y,w,h,10);ctx.clip();
 const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#53667c');g.addColorStop(1,'#b7c3cd');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
 // Mt. Rainier
 ctx.fillStyle='#8193a6';ctx.beginPath();ctx.moveTo(x+w*.55,y+h*.78);ctx.lineTo(x+w*.8,y+h*.38);ctx.lineTo(x+w*1.05,y+h*.78);ctx.fill();
 ctx.fillStyle='#eef3f7';ctx.beginPath();ctx.moveTo(x+w*.74,y+h*.47);ctx.lineTo(x+w*.8,y+h*.38);ctx.lineTo(x+w*.86,y+h*.47);ctx.lineTo(x+w*.82,y+h*.45);ctx.lineTo(x+w*.79,y+h*.49);ctx.closePath();ctx.fill();
 // prédios
 let bx=x;ctx.fillStyle='#2b3a49';
 for(const b of SKY){const bh=b.h*h/300;ctx.fillRect(bx,y+h-bh,b.w*w/380,bh);
  ctx.fillStyle='rgba(255,220,140,.5)';for(let wy=y+h-bh+8;wy<y+h-6;wy+=12)for(let wx=bx+4;wx<bx+b.w*w/380-4;wx+=8)if((wx*7+wy*3)%5<2)ctx.fillRect(wx,wy,3,4);
  ctx.fillStyle='#2b3a49';bx+=b.w*w/380+2}
 // Space Needle
 const nx=x+w*.3,base=y+h;ctx.strokeStyle='#1f2a35';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(nx-14,base);ctx.lineTo(nx-3,base-h*.42);ctx.moveTo(nx+14,base);ctx.lineTo(nx+3,base-h*.42);ctx.moveTo(nx,base);ctx.lineTo(nx,base-h*.42);ctx.stroke();
 ctx.fillStyle='#1f2a35';ell(nx,base-h*.47,30,7);ctx.fill();ell(nx,base-h*.5,20,6);ctx.fill();
 ctx.fillRect(nx-1.5,base-h*.62,3,h*.12);
 // chuva
 ctx.strokeStyle='rgba(220,235,255,.45)';ctx.lineWidth=1.2;
 for(let i=0;i<60;i++){const rx=x+((i*61+t*40)%w),ry=y+((i*97+t*420)%h);ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-3,ry+12);ctx.stroke()}
 ctx.restore();
 ctx.strokeStyle='#d7dee5';ctx.lineWidth=8;rr(x,y,w,h,10);ctx.stroke();
 ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.moveTo(x,y+h/2);ctx.lineTo(x+w,y+h/2);ctx.stroke();
}

// ---------- Lais ----------
function drawLais(x,y,s,happy=true){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle='#d6b066';ell(0,25,64,95);ctx.fill();
 ctx.fillStyle='#d9a07c';ctx.fillRect(-12,50,24,36);
 ctx.fillStyle='#f4f7fa';ctx.strokeStyle='#c4cfd9';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(-88,180);ctx.quadraticCurveTo(-82,88,0,80);ctx.quadraticCurveTo(82,88,88,180);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='#4f8fd6';ctx.beginPath();ctx.moveTo(-22,82);ctx.lineTo(0,132);ctx.lineTo(22,82);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#c4cfd9';ctx.beginPath();ctx.moveTo(-22,82);ctx.lineTo(-8,150);ctx.moveTo(22,82);ctx.lineTo(8,150);ctx.stroke();
 ctx.fillStyle='#2f6fb6';rr(28,112,34,22,4);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(33,119,24,3);ctx.fillRect(33,125,16,3);
 ctx.fillStyle='#e8b590';ell(0,0,46,56);ctx.fill();
 ctx.fillStyle='#e4c47e';ctx.beginPath();ctx.moveTo(-50,0);ctx.quadraticCurveTo(-48,-66,0,-62);ctx.quadraticCurveTo(50,-66,50,0);
 ctx.quadraticCurveTo(34,-34,4,-38);ctx.quadraticCurveTo(-26,-30,-50,0);ctx.fill();
 ctx.strokeStyle='#f3dca0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-30,-48);ctx.quadraticCurveTo(-10,-58,14,-50);ctx.moveTo(20,-52);ctx.quadraticCurveTo(36,-44,42,-22);ctx.stroke();
 ctx.strokeStyle='#b88f4a';ctx.lineWidth=3;ctx.lineCap='round';for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*10,-14);ctx.quadraticCurveTo(s*19,-20,s*28,-14);ctx.stroke()}
 for(const s of[-1,1]){ctx.fillStyle='#fff';ell(s*18,2,8,6);ctx.fill();ctx.fillStyle='#4a7fb5';circle(s*18,2,4.5);ctx.fill();ctx.fillStyle='#1b1b1b';circle(s*18,2,2.2);ctx.fill();
  ctx.fillStyle='#fff';circle(s*18+1.5,0,1.2);ctx.fill();ctx.strokeStyle='#2a1a10';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(s*18,2,8,6,0,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
  ctx.beginPath();ctx.moveTo(s*25,-2);ctx.lineTo(s*29,-5);ctx.stroke()}
 ctx.fillStyle='rgba(230,110,110,.35)';circle(-28,22,7);ctx.fill();circle(28,22,7);ctx.fill();
 ctx.strokeStyle='#8a3b3b';ctx.lineWidth=3;ctx.beginPath();
 if(happy)ctx.arc(0,24,12,.15*Math.PI,.85*Math.PI);else ctx.arc(0,40,10,1.2*Math.PI,1.8*Math.PI);ctx.stroke();
 ctx.restore();
}

// ---------- cérebro ----------
function drawBrain(){
 const g=ctx.createRadialGradient(BX-40,BY-70,20,BX,BY,230);g.addColorStop(0,'#f8cdcd');g.addColorStop(1,'#d58893');
 ctx.lineWidth=3;ctx.strokeStyle='#a45662';
 ctx.fillStyle='#cf8590';rr(BX-28,BY+205,56,80,22);ctx.fill();ctx.stroke();
 ctx.fillStyle=g;ell(BX,BY+192,96,48);ctx.fill();ctx.stroke();
 ctx.strokeStyle='rgba(164,86,98,.55)';ctx.lineWidth=1.6;
 for(let k=1;k<6;k++){const yy=BY+150+k*13,hw=Math.sqrt(Math.max(0,1-((yy-BY-192)/48)**2))*96-6;ctx.beginPath();ctx.moveTo(BX-hw,yy);ctx.quadraticCurveTo(BX,yy+8,BX+hw,yy);ctx.stroke()}
 ctx.strokeStyle='#a45662';ctx.lineWidth=3;
 for(const s of[-1,1]){ctx.fillStyle=g;ell(BX+s*24,BY-198,22,36,s*.15);ctx.fill();ctx.stroke()}
 for(const s of[-1,1]){ctx.fillStyle=g;ell(BX+s*71,BY-10,72,162);ctx.fill();ctx.stroke()}
 ctx.strokeStyle='rgba(160,40,60,.35)';ctx.lineWidth=1.5;
 const V=[[-30,-150,-80,-90,-60,-20],[30,-150,85,-80,55,-10],[-20,-40,-110,-20,-100,60],[20,-40,110,-10,95,70],[-15,40,-60,80,-40,130],[15,40,60,90,45,135]];
 for(const v of V){ctx.beginPath();ctx.moveTo(BX+v[0],BY+v[1]);ctx.quadraticCurveTo(BX+v[2],BY+v[3],BX+v[4],BY+v[5]);ctx.stroke()}
 ctx.strokeStyle='#8f4050';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(BX,BY-172);ctx.lineTo(BX,BY+152);ctx.stroke();
 // bregma
 ctx.strokeStyle='#ffe066';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(BX-9,BREGMA_Y);ctx.lineTo(BX+9,BREGMA_Y);ctx.moveTo(BX,BREGMA_Y-9);ctx.lineTo(BX,BREGMA_Y+9);ctx.stroke();
 txt('bregma',BX+12,BREGMA_Y-6,12,'#ffe066');
}

// ---------- seringa ----------
function drawSyringe(x,y,fluid){
 ctx.save();ctx.translate(x,y);ctx.rotate(.55);
 ctx.lineCap='round';ctx.strokeStyle='#b9c5d1';ctx.lineWidth=56;ctx.beginPath();ctx.moveTo(20,-190);ctx.lineTo(80,-440);ctx.stroke();
 ctx.strokeStyle='#eef2f6';ctx.lineWidth=52;ctx.stroke();
 ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(30,-230);ctx.lineTo(70,-400);ctx.stroke();
 ctx.strokeStyle='#5a4bd1';ctx.lineWidth=44;ctx.beginPath();ctx.moveTo(16,-158);ctx.lineTo(26,-205);ctx.stroke();
 ctx.strokeStyle='#7b6cf6';ctx.lineWidth=40;ctx.stroke();
 ctx.fillStyle='#6f60ee';ell(16,-128,25,34);ctx.fill();
 ctx.strokeStyle='#d5dde5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-55);ctx.stroke();
 ctx.fillStyle='#8fa0b0';ctx.fillRect(-4,-63,8,8);
 const fh=95*fluid,sy=-65-fh;
 ctx.fillStyle='rgba(90,240,160,.85)';ctx.fillRect(-8,sy,16,fh);
 ctx.fillStyle='#333';ctx.fillRect(-8,sy-6,16,6);
 ctx.fillStyle='#e8eef3';ctx.fillRect(-3,sy-90,6,84);ctx.fillRect(-14,sy-96,28,6);
 rr(-10,-170,20,107,4);ctx.fillStyle='rgba(220,240,255,.18)';ctx.fill();ctx.strokeStyle='#e4edf5';ctx.lineWidth=2;ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1;for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(4,-75-i*12);ctx.lineTo(10,-75-i*12);ctx.stroke()}
 ctx.fillStyle='#e4edf5';ctx.fillRect(-18,-173,36,5);
 ctx.fillStyle='#7b6cf6';ctx.strokeStyle='#4f41c4';ctx.lineWidth=1.5;
 ctx.save();ctx.translate(-17,-160);ctx.rotate(-.12);rr(-6,-14,13,36,6.5);ctx.fill();ctx.stroke();ctx.restore();
 for(let i=0;i<4;i++){const fy=-150+i*13.5,fl=i===3?24:30;rr(-17+(30-fl),fy,fl+16,12.5,6.2);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.moveTo(-10+(30-fl),fy+3.5);ctx.lineTo(8,fy+3.5);ctx.stroke();ctx.strokeStyle='#4f41c4'}
 ctx.restore();
}

// ---------- ratos ----------
function drawRatTop(x,y,rot,dead,wag){
 ctx.save();ctx.translate(x,y);ctx.rotate(rot);
 const fur=dead?'#c3c7cc':'#a3acb6',furD=dead?'#a4a9ae':'#7c8793';
 ctx.lineCap='round';ctx.strokeStyle='#e7a1ac';ctx.lineWidth=7;
 ctx.beginPath();ctx.moveTo(0,55);ctx.bezierCurveTo(wag*20,85,-30-wag*10,105,wag*25,140);ctx.stroke();
 ctx.fillStyle='#f0b3bd';const fl=dead?12:0;
 for(const[fx,fy]of[[-30,-12],[30,-12],[-32,40],[32,40]]){ell(fx+Math.sign(fx)*fl,fy,8,6);ctx.fill()}
 const g=ctx.createRadialGradient(-10,0,5,0,15,60);g.addColorStop(0,fur);g.addColorStop(1,furD);ctx.fillStyle=g;
 ell(0,15,35,48);ctx.fill();
 ctx.beginPath();ctx.moveTo(-25,-28);ctx.quadraticCurveTo(-22,-62,0,-80);ctx.quadraticCurveTo(22,-62,25,-28);ctx.quadraticCurveTo(0,-18,-25,-28);ctx.fill();
 for(const s of[-1,1]){ctx.fillStyle=furD;circle(s*21,-40,12);ctx.fill();ctx.fillStyle='#f2b8c2';circle(s*21,-40,7);ctx.fill()}
 if(dead){ctx.strokeStyle='#222';ctx.lineWidth=2.5;for(const s of[-1,1]){const ex=s*10,ey=-56;ctx.beginPath();ctx.moveTo(ex-4,ey-4);ctx.lineTo(ex+4,ey+4);ctx.moveTo(ex+4,ey-4);ctx.lineTo(ex-4,ey+4);ctx.stroke()}}
 else for(const s of[-1,1]){ctx.fillStyle='#111';circle(s*10,-56,3.8);ctx.fill();ctx.fillStyle='#fff';circle(s*10+1,-57,1.2);ctx.fill()}
 ctx.fillStyle='#ee8f9f';circle(0,-79,4.5);ctx.fill();
 ctx.strokeStyle='rgba(40,40,40,.6)';ctx.lineWidth=1;
 for(const s of[-1,1])for(const d of[-8,0,8]){ctx.beginPath();ctx.moveTo(s*4,-72);ctx.lineTo(s*32,-74+d);ctx.stroke()}
 ctx.restore();
}
function thumbsUp(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle='#f4b6c2';ctx.strokeStyle='#b86f7e';ctx.lineWidth=2.5;
 rr(-12,-36,11,28,5);ctx.fill();ctx.stroke();
 rr(-15,-12,32,28,9);ctx.fill();ctx.stroke();
 for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(3,-4+i*7);ctx.lineTo(17,-4+i*7);ctx.stroke()}
 ctx.restore();
}
function drawRatFront(x,y,armK,happy,bob,fur='#a3acb6',furD='#7c8793',sad=false){
 ctx.save();ctx.translate(x,y+bob);
 ctx.strokeStyle='#e7a1ac';ctx.lineWidth=9;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(40,100);ctx.bezierCurveTo(120,120,150,60,120,20);ctx.stroke();
 ctx.fillStyle=fur;ell(0,45,64,78);ctx.fill();
 ctx.fillStyle='#e2e6ea';ell(0,62,40,55);ctx.fill();
 ctx.fillStyle='#f0b3bd';ell(-32,118,22,11);ctx.fill();ell(32,118,22,11);ctx.fill();
 // braço esquerdo (repouso)
 ctx.strokeStyle=fur;ctx.lineWidth=22;ctx.beginPath();ctx.moveTo(-44,10);ctx.lineTo(-38,58);ctx.stroke();
 ctx.fillStyle='#f0b3bd';circle(-38,64,10);ctx.fill();
 // cabeça
 for(const s of[-1,1]){ctx.fillStyle=furD;circle(s*44,-92,28);ctx.fill();ctx.fillStyle='#f2b8c2';circle(s*44,-92,17);ctx.fill()}
 ctx.fillStyle=fur;circle(0,-48,52);ctx.fill();
 ctx.fillStyle='#d4d9de';ell(0,-26,28,22);ctx.fill();
 if(happy){ctx.strokeStyle='#111';ctx.lineWidth=4;for(const s of[-1,1]){ctx.beginPath();ctx.arc(s*19,-56,8,1.1*Math.PI,1.9*Math.PI);ctx.stroke()}}
 else for(const s of[-1,1]){ctx.fillStyle='#111';circle(s*19,-58,7.5);ctx.fill();ctx.fillStyle='#fff';circle(s*19+2,-61,2.5);ctx.fill();
  if(sad){ctx.strokeStyle='#3a3a3a';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(s*10,-72);ctx.lineTo(s*28,-66);ctx.stroke()}}
 ctx.fillStyle='rgba(240,120,140,.45)';circle(-34,-32,8);ctx.fill();circle(34,-32,8);ctx.fill();
 ctx.fillStyle='#ee8f9f';ell(0,-36,8,6);ctx.fill();
 ctx.strokeStyle='#5a3a40';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(0,-24);ctx.arc(-6,-24,6,0,Math.PI*.9);ctx.moveTo(0,-24);ctx.arc(6,-24,6,Math.PI,Math.PI*.1,true);ctx.stroke();
 ctx.fillStyle='#fff';ctx.fillRect(-5,-21,4,6);ctx.fillRect(1,-21,4,6);
 ctx.strokeStyle='rgba(40,40,40,.55)';ctx.lineWidth=1.3;
 for(const s of[-1,1])for(const d of[-9,0,9]){ctx.beginPath();ctx.moveTo(s*14,-30);ctx.lineTo(s*62,-34+d);ctx.stroke()}
 // braço direito (joia)

   for(let i=0;i<40;i++)particles.push({x:560,y:320,vx:rnd(-260,260),vy:rnd(-380,-80),life:rnd(1.2,2.2),c:['#ff6b8b','#ffd166','#4fd1c5','#7aa2ff','#ff9f43'][i%5],h:i%3===0})}

  particles=particles.filter(p=>p.life>0);
 }
}

const BEDDING=[...Array(220)].map(()=>({x:Math.random(),y:Math.random(),r:1+Math.random()*2.5,a:Math.random()*TAU}));
function drawResult(){
 if(res.ok){
  drawLab();panel(220,24,520,90,.75);

// ---------- loop ----------
function draw(){
 buttons=[];
 if(state==='intro')drawIntro();else if(state==='aim'||state==='inject')drawAim();else if(state==='result')drawResult();else if(state==='finale')drawFinale();else drawEnd();
 if(state!=='aim'&&state!=='inject')cv.style.cursor=buttons.some(b=>hit(b,mouse))?'pointer':'default';
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
const BREATH_BTN={x:35,y:556,w:145,h:50};let breathId=null;
cv.addEventListener('pointermove',e=>{if(e.pointerId===breathId)return;const p=toCanvas(e);if(e.pointerType==='touch'&&!inBrainArea(p))return;mouse.x=p.x;mouse.y=p.y});
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}}
 if(e.pointerType==='touch')touchMode=true;
 const p=toCanvas(e);
 if(state==='aim'&&touchMode&&hit(BREATH_BTN,p)){breathId=e.pointerId;keys[' ']=true;return}
 for(const b of buttons)if(hit(b,p)){b.fn();snd(660,.06,'sine',.08);return}
 mouse.x=p.x;mouse.y=p.y;
 if(state==='aim'&&inBrainArea(p)&&!touchMode)inject();
});
const endBreath=e=>{if(e.pointerId===breathId){breathId=null;keys[' ']=false}};
cv.addEventListener('pointerup',endBreath);cv.addEventListener('pointercancel',endBreath);
addEventListener('keydown',e=>{
 if(e.key===' '){e.preventDefault();keys[' ']=true}
 if(e.key==='Enter'&&buttons.length){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}}buttons[0].fn()}
});
addEventListener('keyup',e=>{if(e.key===' ')keys[' ']=false});
addEventListener('blur',()=>keys={});
</script>
